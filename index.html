<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>반띵 - 공동비용 정산 서비스</title>
  <link href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">
      <a href="#"><img src="images/logo.svg" alt="logo" class="logo-img" /></a>
    </div>
    <nav class="nav-pills">
      <a href="#why" class="nav-link active">Why</a>
      <a href="#how" class="nav-link">How</a>
      <a href="#benefit" class="nav-link">Benefit</a>
    </nav>
    <button class="btn-primary btn-header" id="headerNotifyBtn">Notification</button>
  </header>

  <!-- Hero Section -->
  <section class="hero-section">
    <div class="hero-card hero-card-left">
      <div class="pill-badge">
        <span class="badge-icon">💡</span>
        <span>BanDding Service</span>
      </div>
      <h1 class="hero-title">
        Monthly Settlement<br />
        Made Easy & Fast
      </h1>
      <p class="hero-desc">
        Split your monthly rent and utility bills automatically.
      </p>
      
      <form class="email-form" id="emailForm">
        <input type="email" id="emailInput" placeholder="Enter your email" required />
        <button type="submit" class="btn-primary">Submit</button>
      </form>
    </div>

    <div class="hero-card hero-card-right">
      <div class="visual-container">
        <img src="images/hero_visual.svg" alt="visual" class="hero-visual-img" />
      </div>
    </div>
  </section>

  <!-- Message Section -->
  <section class="message-section" id="why">
    <h2 class="section-title">
      Why Bandding?
    </h2>
    <div class="chat-flow">
      <div class="chat-bubble active" data-step="1">
        <span class="step-label">Step 1</span>
        <div class="bubble-content">Send money 47,980 KRW</div>
      </div>
      <div class="chat-bubble" data-step="2">
        <span class="step-label">Step 2</span>
        <div class="bubble-content">Check Transfer</div>
      </div>
    </div>
  </section>

  <div class="toast" id="toast">Complete! 🚀</div>

  <script src="app.js"></script>
</body>
</html>
