<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>알림 신청</title>
  <link rel="stylesheet" href="main.css" />
  <!-- SUIT 폰트 불러오기 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css" />
</head>
<body>
  <div class="container">
    <!-- 디자인 이미지 요소가 있는 경우 (파일명에 맞춰 src 수정) -->
    <!-- <img src="design-image.png" alt="디자인 이미지" class="design-img" /> -->

    <!-- 이메일 및 알림받기 폼 (디자인 원본 위치 반영) -->
    <form class="v1082_10247" id="notifyForm">
      <div class="v1082_9824">
        <input 
          type="email" 
          class="v1082_9825" 
          placeholder="이메일을 적어주세요" 
          required 
        />
      </div>
      <button type="submit" class="v1082_9842">
        <span class="v1082_9843">알림받기</span>
      </button>
    </form>
  </div>

  <script>
    document.getElementById('notifyForm').addEventListener('submit', function(e) {
      e.preventDefault();
      alert('알림 신청이 완료되었습니다!');
    });
  </script>
</body>
</html>
